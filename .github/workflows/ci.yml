name: CI

# Single-branch, no-PR repo: run on pushes to main, on demand and weekly. The weekly run matters
# because nothing is locked: every bundle install and uvx run resolves the newest dependencies in
# pyproject.toml's ranges, and the forum's API can change between releases. GitHub disables a
# repository's schedules after 60 days without activity; re-enable them in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC

# Every job only reads the checkout.
permissions:
  contents: read

# A newer run of the same kind (push, dispatch or schedule) on the same branch cancels one still
# in progress there. Keeping the kinds apart means a push never cancels a run that carries `live`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    # The two corners that can break: the oldest supported Python with each direct dependency at
    # the lowest version the set allows (so the declared floors stay honest), and the newest
    # CPython, the one uv downloads for a Desktop user without a compatible Python, with the
    # newest dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", resolution: "lowest-direct" }
          - { python: "3.15", resolution: "highest" }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install package with dev extras (${{ matrix.resolution }})
        run: |
          pip install uv
          uv pip install --system --resolution ${{ matrix.resolution }} -e '.[dev]'

      - name: Run hermetic tests
        # LW_LIVE_TESTS is unset, so the live tests are skipped and the run stays offline.
        run: pytest -q

  lint:
    # Ruff and mypy take their target version from pyproject.toml, not the interpreter, so one
    # run on 3.11 checks the code as 3.11 code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check the package)
        run: mypy lesswrong_mcp

  bundle:
    # Packs the .mcpb as a release does, with the mcpb version README.md and CLAUDE.md pin.
    # `mcpb pack` exits 0 even when .mcpbignore drops the package or entry_point names a missing
    # file, so the last step checks the archive against the tracked files it must carry.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCPB: "@anthropic-ai/mcpb@2.1.2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate manifest.json against the MCPB schema
        run: npx --yes "$MCPB" validate manifest.json

      - name: Pack the bundle
        run: npx --yes "$MCPB" pack . dist/lesswrong-mcp.mcpb

      - name: Check the bundle holds exactly the server
        run: |
          unzip -Z1 dist/lesswrong-mcp.mcpb | sort > "$RUNNER_TEMP/bundle.txt"
          git ls-files LICENSE manifest.json pyproject.toml lesswrong_mcp | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/bundle.txt"
          entry=$(node -p "require('./manifest.json').server.entry_point")
          grep -qxF "$entry" "$RUNNER_TEMP/bundle.txt" || { echo "::error::entry_point $entry is not in the bundle"; exit 1; }

  live:
    # The opt-in live tests: read-only requests to the real forum, one at a time, on the weekly
    # schedule and on demand only, so a push never waits on, or fails with, the forum.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the live tests against the forum
        env:
          LW_LIVE_TESTS: "1"
        run: pytest -m live -q
