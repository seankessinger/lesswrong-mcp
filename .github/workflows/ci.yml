name: CI

# Single-branch, no-PR repo: run on pushes to main, on demand and weekly. No pull_request
# trigger, since work lands directly on main (see CLAUDE.md "Git workflow"). The weekly run
# matters because nothing is locked: every bundle install and uvx run resolves the newest
# dependencies in pyproject.toml's ranges, and the forum's API can change between releases, so
# the suite re-runs against both when nothing has been pushed. GitHub disables a repository's
# schedules after 60 days without activity; re-enable them in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC

# Every job only reads the checkout, so the token can read the contents and nothing more,
# whatever the repository's default.
permissions:
  contents: read

# A newer run of the same kind (push, dispatch or schedule) on the same branch cancels one still
# in progress there: it covers the latest commit. Keeping the kinds apart means a push never
# cancels, or is cancelled by, a run that carries the live job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Every CPython from requires-python = ">=3.11" in pyproject.toml to the newest release,
      # which is the one uv downloads for a Claude Desktop user who has no compatible Python.
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run hermetic tests
        # LW_LIVE_TESTS is left unset, so the opt-in live-network tests stay skipped and this
        # job never touches the forum API: the run is deterministic and offline.
        run: pytest -q

  test-lowest:
    # The `test` matrix always resolves the newest dependencies, so a declared floor the code
    # has outgrown passes there unnoticed. Resolve each direct dependency to the lowest version
    # the whole set allows (lowest-direct) on the oldest supported Python and run the suite
    # against that: mcp, httpx and pydantic each land on their declared floor.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with dev extras at the lowest direct versions
        run: |
          pip install uv
          uv pip install --system --resolution lowest-direct -e '.[dev]'

      - name: Run hermetic tests
        run: pytest -q

  lint:
    # Runs once, on 3.11. Ruff and mypy take their target version from pyproject.toml
    # (target-version py311, python_version 3.11), not from the interpreter they run on, so they
    # check the code as 3.11 code wherever they run and a matrix would repeat that one check. They
    # do not check it against a newer CPython: a stdlib or typing change from 3.12 onwards is
    # the `test` matrix's to catch, at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (type-check the package)
        run: mypy lesswrong_mcp

  bundle:
    # Packs the .mcpb as a release build does, with the mcpb version the build commands in
    # README.md and CLAUDE.md pin. `mcpb pack` exits 0 even when .mcpbignore drops the package
    # or the manifest's entry_point names a file that isn't there, so the last step checks the
    # archive against the tracked files it must carry.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCPB: "@anthropic-ai/mcpb@2.1.2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate manifest.json against the MCPB schema
        run: npx --yes "$MCPB" validate manifest.json

      - name: Pack the bundle
        run: npx --yes "$MCPB" pack . dist/lesswrong-mcp.mcpb

      - name: Check the bundle holds exactly the server
        # The expected set is every tracked file under the roots .mcpbignore admits.
        run: |
          unzip -Z1 dist/lesswrong-mcp.mcpb | sort > "$RUNNER_TEMP/bundle.txt"
          git ls-files LICENSE manifest.json pyproject.toml lesswrong_mcp | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/bundle.txt"
          entry=$(node -p "require('./manifest.json').server.entry_point")
          grep -qxF "$entry" "$RUNNER_TEMP/bundle.txt" || { echo "::error::entry_point $entry is not in the bundle"; exit 1; }

  live:
    # The opt-in live tests: read-only requests to the real forum, one at a time. They run on
    # the weekly schedule and on demand only, so a push never waits on, or fails with, the forum.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run the live tests against the forum
        env:
          LW_LIVE_TESTS: "1"
        run: pytest -m live -q
